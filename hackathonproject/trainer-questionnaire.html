<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Questionnaire | The Thing</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-auth="true" data-role="Trainer">
    <aside class="sidebar"><a class="brand" href="trainee-dashboard.html"><img class="logo" src="assets/logo.svg">The
            Thing</a>
        <div class="side-links"><a href="trainee-dashboard.html" data-role="Trainee">⌂ <span>Dashboard</span></a><a
                href="course-catalog.html">▣ <span>Courses</span></a><a href="assessment-instructions.html">✓
                <span>Assessments</span></a><a href="performance.html">📈 <span>Performance</span></a><a
                href="library.html">▤ <span>Library</span></a><a href="certificate.html">🏆
                <span>Certificates</span></a><a href="feedback.html">✎ <span>Feedback</span></a><a
                href="notifications.html">🔔 <span>Notifications</span></a><a href="profile.html">◎
                <span>Profile</span></a><a href="settings.html">⚙ <span>Settings</span></a><a
                href="trainer-dashboard.html" data-role="Trainer">👨‍🏫 <span>Trainer Dashboard</span></a><a
                href="trainer-questionnaire.html" data-role="Trainer">📝 <span>Create Assessment</span></a><a
                href="admin-dashboard.html" data-role="Admin">▦ <span>Admin Dashboard</span></a><a href="index.html"
                data-logout>↪ <span>Logout</span></a></div>
    </aside>
    <div class="app">
        <header class="dashboard-top"><button class="menu-btn" data-menu>☰</button>
            <div class="search">⌕ <input placeholder="Search courses, resources..."></div><button class="theme-mini"
                title="Theme" onclick="toggleTheme(localStorage.getItem('thing_theme')!=='dark')">☾</button>
            <div class="top-user">🔔 <span data-user-name>User</span><small data-user-role>Trainee</small>
                <div class="avatar" data-user-avatar>U</div>
            </div>
        </header>
        <main class="content">
            <div class="page-heading">
                <div><span class="eyebrow">TRAINER</span>
                    <h1>Create Questionnaire</h1>
                    <p>Build a timed assessment for trainees.</p>
                </div>
            </div>
            <section class="panel form-card">
                <div class="form-grid"><label>Assessment Title<input
                            placeholder="e.g. HTML Fundamentals"></label><label>Subject<select>
                            <option>Web Development</option>
                            <option>Python</option>
                            <option>C++</option>
                        </select></label><label>Deadline<input type="date"></label><label>Duration (minutes)<input
                            type="number" value="30"></label></div>
                <hr>
                <h3>Question 1</h3><label>Question<textarea placeholder="Enter your question..."></textarea></label>
                <div class="form-grid"><label>Option A<input></label><label>Option B<input></label><label>Option
                        C<input></label><label>Option D<input></label></div><label>Correct Answer<select>
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                        <option>D</option>
                    </select></label>
                <div class="actions"><button class="btn btn-ghost" onclick="showToast('Question added.')">＋ Add
                        Question</button><button class="btn btn-primary" onclick="showToast('Assessment saved!')">Save
                        Assessment</button></div>
            </section>
        </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
