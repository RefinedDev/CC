<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | The Thing</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="auth-wrap"><a class="brand centered" href="index.html"><img class="logo" src="assets/logo.svg">The Thing</a><div class="auth-card"><h1>Create Account</h1><p>Your name and role will be used across the portal.</p><form action="#" method="post" onsubmit="return window.signup(event);"><label>Full Name<input id="signup-name" required placeholder="Enter your name"></label><label>Email<input type="email" required placeholder="you@example.com"></label><label>Role<select id="signup-role"><option>Trainee</option><option>Trainer</option><option>Admin</option></select></label><label>Password<input type="password" required placeholder="Create a password"></label><label class="check"><input type="checkbox" required>I agree to the Terms & Conditions</label><button class="btn btn-primary full">Sign Up</button></form><p class="auth-bottom">Already have an account? <a href="login.html">Login</a></p></div></div><script src="js/auth.js?v=5"></script><script src="js/app.js?v=5"></script></body></html>
