<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Courses | Capacity Connect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-auth="true" data-role="Trainer">
  <aside class="sidebar">
    <a class="brand" href="trainer-dashboard.html"><img class="logo" src="assets/logo.svg" alt="Capacity Connect logo"><span>Capacity Connect</span></a>
    <div class="side-links">
      <a href="trainer-dashboard.html">⌂ <span>Dashboard</span></a>
      <a href="course-catalog.html">▣ <span>Courses</span></a>
      <a class="active" href="course-management.html">＋ <span>Manage Courses</span></a>
      <a href="trainer-questionnaire.html">📝 <span>Create Assessment</span></a>
      <a href="index.html" data-logout>↪ <span>Logout</span></a>
    </div>
  </aside>
  <div class="app">
    <header class="dashboard-top"><button class="menu-btn" data-menu>☰</button><div class="top-user"><span data-user-name>User</span><small data-user-role>Trainer</small><div class="avatar" data-user-avatar>U</div></div></header>
    <main class="content">
      <div class="page-heading"><div><span class="eyebrow">TRAINER</span><h1>Manage Courses</h1><p>Create a course for trainees to discover and enroll in.</p></div></div>
      <section class="panel">
        <form id="courseForm" class="enroll-form">
          <label>Course title<input id="courseTitle" required maxlength="120" placeholder="e.g. Rust fundamentals"></label>
          <label>Description<textarea id="courseDescription" required maxlength="500" rows="4" placeholder="Describe what trainees will learn"></textarea></label>
          <button class="btn btn-primary" type="submit">Create Course</button>
          <p id="courseMessage" role="status"></p>
        </form>
      </section>
      <section class="panel" style="margin-top:18px">
        <h2>Manage lecture content</h2>
        <p>Select one of your courses to add or remove lectures.</p>
        <select id="managedCourse"><option value="">Loading courses...</option></select>
        <form id="lectureForm" class="enroll-form" style="margin-top:16px">
          <label>Lecture title<input id="lectureTitle" required maxlength="120" placeholder="e.g. Variables and data types"></label>
          <label>Description<textarea id="lectureDescription" required maxlength="500" rows="3" placeholder="What this lecture covers"></textarea></label>
          <button class="btn btn-primary" type="submit">Add Lecture</button>
          <p id="lectureMessage" role="status"></p>
        </form>
        <div id="lectureList" class="resource-list" style="margin-top:18px"></div>
      </section>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/course-management.js"></script>
</body>
</html>
