<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Course Catalog | Capacity Connect</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .course-card .course-action {
            margin-top: 14px
        }

        .enrolled-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(24, 185, 154, .14);
            color: #19a985;
            font-size: 12px;
            font-weight: 800;
            margin-top: 12px
        }

        .course-progress-mini {
            height: 7px;
            background: var(--surface-2);
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px
        }

        .course-progress-mini i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #2867f2, #08b8d0)
        }
    </style>
</head>

<body data-auth="true">
    <aside class="sidebar"><a class="brand" href="trainee-dashboard.html"><img class="logo"
                src="assets/logo.svg"><span>Capacity Connect</span></a>
        <div class="side-links"><a href="trainee-dashboard.html">⌂ <span>Dashboard</span></a><a
                href="course-catalog.html">▣ <span>Courses</span></a><a href="assessment-instructions.html">✓
                <span>Assessments</span></a><a href="performance.html">📈 <span>Performance</span></a><a
                href="library.html">▤ <span>Library</span></a><a href="certificate.html">🏆
                <span>Certificates</span></a><a
                href="notifications.html">🔔 <span>Notifications</span></a><a href="profile.html">◎
                <span>Profile</span></a><a href="settings.html">⚙ <span>Settings</span></a><a href="index.html"
                data-logout>↪ <span>Logout</span></a></div>
    </aside>
    <div class="app">
        <header class="dashboard-top"><button class="menu-btn" data-menu>☰</button>
            <div class="search">⌕ <input placeholder="Search courses, resources..."></div><button class="theme-mini"
                onclick="toggleTheme(localStorage.getItem('thing_theme')!=='dark')">☾</button>
            <div class="top-user">🔔 <span data-user-name>User</span><small data-user-role>Trainee</small>
                <div class="avatar" data-user-avatar>U</div>
            </div>
        </header>
        <main class="content">
            <div class="page-heading">
                <div><span class="eyebrow">LEARNING</span>
                    <h1>Course Catalog</h1>
                    <p>Enroll in a course, then start learning from its lecture list.</p>
                </div>
                <div class="filter-row"><input placeholder="Search courses..."><select>
                        <option>All Categories</option>
                        <option>Programming</option>
                        <option>Design</option>
                    </select></div>
            </div>
            <div class="course-grid" id="courseGrid"></div>
        </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/courses.js"></script>
</body>

</html>
