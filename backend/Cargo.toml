[package]
name = "capacity_connect"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = {version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.0.0"
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
tower-http = { version = "0.6", features = ["cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
